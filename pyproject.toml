[project]
name = "pdf-md"
version = "0.1.0"
description = "Batch CLI to convert PDFs to clean Markdown (with extracted images and tables) using Docling and Typer."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kevin Kabeya", email = "kevinkabeyam@gmail.com" }]
requires-python = ">=3.11"
keywords = ["pdf", "markdown", "docling", "typer", "cli", "ocr", "document-conversion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "typer>=0.12",
    "docling>=2.0",
]

[project.urls]
Homepage = "https://github.com/K2412/pdf-md"
Repository = "https://github.com/K2412/pdf-md"
Issues = "https://github.com/K2412/pdf-md/issues"

[project.scripts]
pdf-md = "pdf_md.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_md"]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
